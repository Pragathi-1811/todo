services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tododb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./todo-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/tododb
      DB_USER: root
      DB_PASSWORD: rootpass
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./todo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: